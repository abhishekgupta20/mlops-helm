# ==============================================================================
# CI/CD for the ml-api Helm chart: lint/test it, then package and publish it
# to a private OCI Helm registry (GHCR, using this repo's own free registry).
# ==============================================================================
name: helm-ci-cd

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/ml-api/**"
  push:
    branches: [main]
    paths:
      - "charts/ml-api/**"

env:
  CHART_DIR: charts/ml-api
  REGISTRY: ghcr.io
  CHART_OCI_REPO: ghcr.io/${{ github.repository_owner }}/charts

permissions:
  contents: read
  packages: write   # needed to push to GHCR's OCI registry

jobs:
  build:
    name: Lint & test chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Add helm-unittest plugin
        # Pinned to v0.7.2 (stable, predates the newer plugin.yaml schema
        # that isn't compatible with Helm 3.16.x). "latest" can silently
        # jump to a release Helm here can't parse.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.2

      - name: helm lint (default + each environment's values)
        run: |
          helm lint ${{ env.CHART_DIR }}
          for env in dev staging production; do
            helm lint ${{ env.CHART_DIR }} -f ${{ env.CHART_DIR }}/values-${env}.yaml
          done

      - name: helm template (render sanity check, all environments)
        run: |
          for env in dev staging production; do
            helm template ml-api-${env} ${{ env.CHART_DIR }} \
              -f ${{ env.CHART_DIR }}/values-${env}.yaml > /tmp/rendered-${env}.yaml
            test -s /tmp/rendered-${env}.yaml
          done

      - name: helm unittest (chart unit tests)
        run: helm unittest ${{ env.CHART_DIR }}

  publish:
    name: Package & publish chart
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Read chart version
        id: chart_version
        run: |
          version=$(grep '^version:' ${{ env.CHART_DIR }}/Chart.yaml | awk '{print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package ${{ env.CHART_DIR }} --destination ./dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: |
          helm push ./dist/ml-api-${{ steps.chart_version.outputs.version }}.tgz \
            oci://${{ env.CHART_OCI_REPO }}

      - name: Summary
        run: |
          echo "Published ml-api chart v${{ steps.chart_version.outputs.version }} to oci://${{ env.CHART_OCI_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo 'Pull it with: helm pull oci://${{ env.CHART_OCI_REPO }}/ml-api --version ${{ steps.chart_version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
          