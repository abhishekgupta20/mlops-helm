{{/*
Only render a Secret object when secret.enabled is true AND no
existingSecret was supplied. In every environment above production-grade
Dev, secrets should come from an externally-managed Secret (created by
External Secrets Operator, Sealed Secrets, SOPS+kustomize, or your cloud
provider's secret manager) referenced via `secret.existingSecret`, so that
no plaintext value ever lands in this repository or in `helm history`.
See README.md -> "Secrets Handling" for the full rationale.
*/}}
{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ml-api.fullname" . }}-secret
  labels:
    {{- include "ml-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
