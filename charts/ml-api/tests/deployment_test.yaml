# Unit tests for the ml-api chart, run with the `helm-unittest` plugin:
#   helm plugin install https://github.com/helm-unittest/helm-unittest
#   helm unittest charts/ml-api
suite: ml-api deployment tests
templates:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: renders the correct default image
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "gcr.io/google-samples/hello-app:1.0"

  - it: sets replicaCount when autoscaling is disabled
    template: deployment.yaml
    set:
      replicaCount: 4
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 4

  - it: omits spec.replicas entirely when autoscaling is enabled (HPA owns it)
    template: deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: sets requested and limit resources from values
    template: deployment.yaml
    set:
      resources.requests.cpu: 111m
      resources.limits.memory: 222Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 111m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 222Mi

  - it: does not run as root by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: creates a ClusterIP service by default
    template: service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: creates a NodePort service when overridden (dev-style)
    template: service.yaml
    set:
      service.type: NodePort
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: does NOT render an HPA when autoscaling is disabled
    template: hpa.yaml
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA with correct min/max when autoscaling is enabled
    template: hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 8
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 8

  - it: does NOT render an Ingress when disabled (chart default)
    template: ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Ingress with the configured host when enabled
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.hosts[0].host: unit-test.example.com
      ingress.hosts[0].paths[0].path: /
      ingress.hosts[0].paths[0].pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].host
          value: unit-test.example.com

  - it: renders ConfigMap data verbatim
    template: configmap.yaml
    set:
      configMap.data.APP_ENV: unit-test
    asserts:
      - equal:
          path: data.APP_ENV
          value: unit-test

  - it: does NOT render a Secret object when an existingSecret is referenced
    template: secret.yaml
    set:
      secret.enabled: true
      secret.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Secret object only when enabled with no existingSecret
    template: secret.yaml
    set:
      secret.enabled: true
      secret.existingSecret: ""
      secret.data.FOO: bar
    asserts:
      - equal:
          path: stringData.FOO
          value: bar
