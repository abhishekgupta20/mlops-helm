# ==================================
# STAGING environment overrides
# ==================================

environment: staging

replicaCount: 2

image:
  tag: "1.0"          # MLEs pin to a release-candidate tag here
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: ml-api.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ml-api-staging-tls
      hosts:
        - ml-api.staging.example.com

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

configMap:
  data:
    APP_ENV: "staging"
    LOG_LEVEL: "info"
    MODEL_VERSION: "rc-candidate"

secret:
  enabled: true
  existingSecret: "ml-api-staging-secret"   # created out-of-band, see README
